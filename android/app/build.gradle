import java.security.KeyStore
import java.security.MessageDigest

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def blocklistManifestUrl = System.getenv("AURA_BLOCKLIST_MANIFEST_URL") ?: ""
def phishTankAppKey = System.getenv("PHISHTANK_APP_KEY") ?: ""
def telemetryEndpoint = System.getenv("AURA_TELEMETRY_ENDPOINT") ?: ""
def socks5Host = System.getenv("AURA_SOCKS5_HOST") ?: ""
def socks5Port = System.getenv("AURA_SOCKS5_PORT") ?: ""
def modelVersion = System.getenv("AURA_MODEL_VERSION") ?: "3.0.0"
def buildConfigString = { value ->
    '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
}

android {
    namespace "com.ciberdefensa.aura"
    compileSdk 36

    // Keep the app, Flutter plugins, and Flutter stable SDK on the same NDK version.
    ndkVersion "28.2.13676358"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Migration exercises the platform Keystore, not a desktop JVM provider.
    testBuildType "storageMigration"

    defaultConfig {
        applicationId "com.ciberdefensa.aura"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField(
            "String",
            "AURA_BLOCKLIST_MANIFEST_URL",
            buildConfigString(blocklistManifestUrl),
        )
        buildConfigField(
            "String",
            "PHISHTANK_APP_KEY",
            buildConfigString(phishTankAppKey),
        )
        buildConfigField(
            "String",
            "AURA_TELEMETRY_ENDPOINT",
            buildConfigString(telemetryEndpoint),
        )
        buildConfigField(
            "String",
            "AURA_SOCKS5_HOST",
            buildConfigString(socks5Host),
        )
        buildConfigField(
            "String",
            "AURA_SOCKS5_PORT",
            buildConfigString(socks5Port),
        )
        buildConfigField(
            "String",
            "AURA_MODEL_VERSION",
            buildConfigString(modelVersion),
        )

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("AURA_KEYSTORE_PATH")
            storeFile = keystorePath ? project.file(keystorePath).absoluteFile : null
            storePassword = System.getenv("AURA_STORE_PASSWORD")
            keyAlias = System.getenv("AURA_KEY_ALIAS")
            keyPassword = System.getenv("AURA_KEY_PASSWORD")
        }
    }

    buildTypes {
        // Never install migration fixtures under the user's application UID.
        storageMigration {
            initWith debug
            applicationIdSuffix ".vaultmigrationtest"
            matchingFallbacks = ['debug']
        }
        release {
            def requiredSigningVariables = [
                "AURA_KEYSTORE_PATH",
                "AURA_STORE_PASSWORD",
                "AURA_KEY_ALIAS",
                "AURA_KEY_PASSWORD",
            ]
            def missingSigningVariables = requiredSigningVariables.findAll { variable ->
                def value = System.getenv(variable)
                value == null || value.trim().isEmpty()
            }
            def keystorePath = System.getenv("AURA_KEYSTORE_PATH")
            def keystoreFile = keystorePath ? project.file(keystorePath).absoluteFile : null
            def isDebugFallback = !missingSigningVariables.isEmpty() ||
                keystoreFile == null || !keystoreFile.isFile()
            def debugFallbackExplicitlyAllowed =
                System.getenv("AURA_ALLOW_DEBUG_SIGNING") == "true"

            if (isDebugFallback && !debugFallbackExplicitlyAllowed) {
                def reason = missingSigningVariables.isEmpty()
                    ? "AURA_KEYSTORE_PATH must reference an existing keystore file."
                    : "Missing release signing variable(s): ${missingSigningVariables.join(', ')}"
                throw new GradleException(
                    "${reason} Set AURA_ALLOW_DEBUG_SIGNING=true only for a local test build."
                )
            }

            signingConfig isDebugFallback ? signingConfigs.debug : signingConfigs.release
            buildConfigField "boolean", "IS_DEBUG_FALLBACK", String.valueOf(isDebugFallback)

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

