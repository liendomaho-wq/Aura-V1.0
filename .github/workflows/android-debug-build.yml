name: Aura Android Debug Build

on:
  push:
    branches:
      - main
      - principal
      - arena/063013fc-aura-v1-0
  pull_request:
    branches:
      - main
      - principal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-android-debug-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build Android debug APK (Kotlin/C/JNI)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install declared Android toolchain
        run: python3 tool/ci_run.py sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: python3 tool/ci_run.py flutter pub get

      - name: Run Kotlin VPN and local SOCKS5 unit tests
        working-directory: android
        run: AURA_ALLOW_DEBUG_SIGNING=true python3 ../tool/ci_run.py ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Validate generated VPN configuration template
        run: python3 tool/ci_run.py python3 tool/test_vpn_config_template.py

      - name: Build debug APK including native tunnel
        run: python3 tool/ci_run.py flutter build apk --debug

      - name: Verify debug APK exists
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          git rev-parse HEAD > build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/SHA256SUMS
          printf '::notice title=Debug APK SHA-256::%s\n' "$(cat build/app/outputs/flutter-apk/SHA256SUMS)"

      - name: Upload debug APK and exact source identity
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
