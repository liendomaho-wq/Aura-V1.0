name: Aura llama.cpp Android ARM64 build spike

on:
  pull_request:
    paths:
      - ".github/workflows/aura-llama-android-build.yml"
      - "docs/LLAMA_ANDROID_RUNTIME_SPIKE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-llama-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-llama-android-arm64:
    name: Build pinned llama.cpp for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Aura
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 806b3c2bed44490233f1e8ffa403519370965fe7
          path: third_party/llama.cpp
          persist-credentials: false

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Configure portable CPU-only Android ARM64 build
        run: |
          cmake -S third_party/llama.cpp -B build/llama-android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_VULKAN=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/artifacts/llama-android-arm64"

      - name: Compile llama.cpp static runtime
        run: cmake --build build/llama-android-arm64 --config Release --target llama --parallel 2

      - name: Verify ARM64 runtime archive and install public headers
        run: |
          cmake --install build/llama-android-arm64 --config Release
          test -d artifacts/llama-android-arm64/include
          find artifacts/llama-android-arm64 -type f -name 'libllama.a' -print -quit | grep -q .
          find artifacts/llama-android-arm64 -type f -name 'libggml*.a' -print -quit | grep -q .
          printf 'Pinned llama.cpp commit: %s\n' '806b3c2bed44490233f1e8ffa403519370965fe7' > artifacts/llama-android-arm64/BUILD-INFO.txt
          printf 'ABI: arm64-v8a\nNDK: 28.2.13676358\n' >> artifacts/llama-android-arm64/BUILD-INFO.txt
          find artifacts/llama-android-arm64 -maxdepth 3 -type f | sort

      - name: Upload native runtime build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-llama-android-arm64-static
          path: artifacts/llama-android-arm64/
          if-no-files-found: error
          retention-days: 14
