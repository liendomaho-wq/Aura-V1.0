name: Aura Flutter Quality

on:
  pull_request:
    branches:
      - main
      - principal
  push:
    branches:
      - main
      - principal
      - arena/063013fc-aura-v1-0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter analysis and security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17 for real signed-AAB tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python test dependencies
        run: python -m pip install -r tool/requirements-train.txt

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: python3 tool/ci_run.py flutter pub get

      - name: Record resolved dependency lockfile for reproducibility review
        run: |
          python3 - <<'PYTHON'
          import base64
          from pathlib import Path

          data = base64.b64encode(Path('pubspec.lock').read_bytes()).decode('ascii')
          for offset in range(0, len(data), 4000):
              print(f'::notice title=RESOLVED_LOCKFILE_{offset // 4000:03d}::{data[offset:offset + 4000]}')
          PYTHON

      - name: Dart format
        run: python3 tool/ci_run.py --format-diff dart format --set-exit-if-changed .

      - name: Static security regression checks
        run: |
          python3 tool/ci_run.py python3 tool/test_gradle_wrapper_policy.py
          python3 tool/ci_run.py python3 tool/test_install_android_ndk.py
          python3 tool/ci_run.py python3 tool/test_vpn_config_template.py
          python3 tool/ci_run.py python3 tool/test_aura_sni_firewall.py
          python3 tool/ci_run.py python3 tool/test_mapped_dns.py
          python3 tool/ci_run.py python3 tool/test_tun_packet_filter.py
          python3 tool/ci_run.py python3 tool/test_lwip_fragment_policy.py
          python3 tool/ci_run.py python3 tool/test_verify_packaged_model.py
          python3 tool/ci_run.py python3 tool/test_release_signing_policy.py
          python3 tool/ci_run.py python3 tool/test_release_signing_runtime.py
          python3 tool/ci_run.py python3 tool/test_verify_aab.py

      - name: Full Python suite (JDK required; no omitted AAB tests)
        run: python3 tool/ci_run.py python3 -m pytest -q -rs

      - name: Static analysis
        run: python3 tool/ci_run.py flutter analyze --no-pub

      - name: Unit and widget tests
        run: python3 tool/ci_run.py flutter test --no-pub
