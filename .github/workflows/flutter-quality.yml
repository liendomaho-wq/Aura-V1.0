name: Aura Flutter Quality

on:
  pull_request:
    branches:
      - main
      - principal
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter analysis and security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static security regression checks
        run: |
          python3 tool/test_vpn_config_template.py
          python3 tool/test_aura_sni_firewall.py

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Unit and widget tests
        run: flutter test --no-pub
