name: Aura Flutter Quality

on:
  pull_request:
    branches:
      - main
      - principal
  push:
    branches:
      - main
      - principal
      - rebuild/vpn-from-zero
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Unit and widget tests
        run: flutter test --no-pub
