name: Aura Model Dataset, Training and Benchmark

on:
  pull_request:
    paths:
      - 'tool/**'
      - 'data/**'
      - '.github/workflows/model-training.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/**'
      - 'data/**'
      - '.github/workflows/model-training.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-model-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/requirements-train.txt
      - name: Install training and test dependencies
        run: python -m pip install -r tool/requirements-train.txt
      - name: Build dataset from commercially permitted sources
        run: python tool/dataset/build_dataset.py --sources phishing_database
      - name: Build disjoint synthetic typosquat robustness splits
        run: python tool/dataset/build_adversarial_splits.py
      - name: Train model and write held-out metrics
        run: python tool/ci_run.py python tool/train_max_aura_brain.py --preset mobile
      - name: Summarize candidate quality evidence
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          metrics = json.loads(Path('tool/reports/metrics_mobile.json').read_text())
          for split in ('test_metrics', 'adversarial_test_metrics'):
              values = metrics[split]
              print(f"::notice title=Candidate {split}::recall={values['recall']:.6f}; false_positive_rate={values['false_positive_rate']:.6f}")
          print(f"::notice title=Candidate size::bytes={metrics['model_bytes']}; depth={metrics['maximum_observed_depth']}")
          PYTHON
      - name: Benchmark warm and cold inference
        run: python tool/bench_aura_brain.py
      - name: Run golden tests (even if candidate training is rejected)
        if: always()
        run: python -m pytest tool/test_aura_brain.py tool/test_adversarial.py tool/test_adversarial_split_builder.py tool/test_grouped_splits.py -q
      - name: Upload reports (including rejected candidates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-model-pipeline-reports
          path: tool/reports/*
          if-no-files-found: warn
          retention-days: 30
      # CI artifacts are unsigned candidates; release signing stays manual with tool/sign_model.py.
