name: Aura Model Dataset, Training and Benchmark

on:
  pull_request:
    paths:
      - 'tool/**'
      - 'data/**'
      - '.github/workflows/model-training.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/**'
      - 'data/**'
      - '.github/workflows/model-training.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-model-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/requirements-train.txt
      - name: Install training and test dependencies
        run: python -m pip install -r tool/requirements-train.txt
      - name: Build dataset from commercially permitted sources
        run: python tool/dataset/build_dataset.py --sources phishing_database
      - name: Build disjoint synthetic typosquat robustness splits
        run: python tool/dataset/build_adversarial_splits.py
      - name: Train model and write held-out metrics
        run: python tool/train_max_aura_brain.py
      - name: Benchmark warm and cold inference
        run: python tool/bench_aura_brain.py
      - name: Run golden tests (even if candidate training is rejected)
        if: always()
        run: python -m pytest tool/test_aura_brain.py tool/test_adversarial_split_builder.py -q
      - name: Upload reports (including rejected candidates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-model-pipeline-reports
          path: tool/reports/*
          if-no-files-found: warn
          retention-days: 30
      # CI artifacts are unsigned candidates; release signing stays manual with tool/sign_model.py.
