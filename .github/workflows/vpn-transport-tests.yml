name: Aura Local VPN Transport Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/vpn-transport-tests.yml'
  push:
    branches:
      - feature/local-vpn-transport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpn-transport-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
