name: aura_mobile_defens
description: "Aura Mobile Defens — software propietario de defensa cibernética de alto riesgo."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  crypto: ^3.0.7
  encrypt: ^5.0.3
  ffi: ^2.2.0
  http: ^1.6.0
  local_auth: ^2.3.0
  path_provider: ^2.1.6
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.4
  flutter_tts: ^4.2.5
  url_launcher: 6.3.2

dependency_overrides:
  # Conserva el mínimo de Flutter del lockfile.
  url_launcher_android: 6.3.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model/aura_brain_model.json
    - assets/model/aura_brain_model.json.sha256
    - assets/model/aura_brain_model.json.sig
