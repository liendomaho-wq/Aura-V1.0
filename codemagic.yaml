workflows:
  android-build:
    name: Aura Android Release Pipeline
    max_build_duration: 90
    # macOS M2 is available on Codemagic's individual free plan.
    # Linux X2 requires billing to be enabled.
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    environment:
      groups:
        - production_keys # This group must exist; values are managed by the owner in Codemagic.
      vars:
        # applicationId real definido en android/app/build.gradle: com.ciberdefensa.aura
        AURA_BUILD_FORMAT: "apk"
        AURA_REQUIRE_RELEASE_SIGNING: "false"
      flutter: stable
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        # PR builds must match the destination branch (main), not the
        # temporary feature/source branch. Push events still match main.
        - pattern: 'main'
          include: true
          source: false
        - pattern: 'principal'
          include: true
          source: false
    scripts:
      - name: Resolve Codemagic keystore file variable (Optional)
        script: |
          set -euo pipefail
          if [[ -n "${AURA_KEYSTORE_FILE:-}" && -z "${AURA_KEYSTORE_PATH:-}" ]]; then
            if [[ -f "$AURA_KEYSTORE_FILE" && -n "${CM_ENV:-}" ]]; then
              printf 'AURA_KEYSTORE_PATH=%s\n' "$AURA_KEYSTORE_FILE" >> "$CM_ENV"
            else
              echo '[AURA-PREFLIGHT][WARNING] AURA_KEYSTORE_FILE missing. Falling back to debug signing.'
            fi
          fi
      - name: Resolve Flutter dependencies and record toolchain
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          flutter --version
          flutter pub get
      - name: Install declared Android NDK
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          bash tool/install_android_ndk.sh
      - name: Check Dart formatting
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          dart format --set-exit-if-changed .
      - name: Analyze Flutter and Dart code
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          flutter analyze --no-pub
      - name: Run Aura security regression checks and Flutter tests
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          python3 tool/test_gradle_wrapper_policy.py
          python3 tool/test_install_android_ndk.py
          python3 tool/test_vpn_config_template.py
          python3 tool/test_aura_sni_firewall.py
          python3 tool/test_mapped_dns.py
          python3 tool/test_tun_packet_filter.py
          python3 tool/test_lwip_fragment_policy.py
          python3 tool/test_verify_packaged_model.py
          python3 tool/test_release_signing_policy.py
          python3 tool/test_release_signing_runtime.py
          python3 tool/test_verify_aab.py
          flutter test --reporter expanded
      - name: Test AI model and dataset safeguards
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          python3 --version
          VENV_DIR="$(mktemp -d "${TMPDIR:-/tmp}/aura-model-tests.XXXXXX")"
          trap 'rm -rf "$VENV_DIR"' EXIT
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install -r tool/requirements-train.txt
          "$VENV_DIR/bin/python" -m pytest -q -rs
      - name: Test VPN request correlation on Android JVM
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}/android"
          # Gradle configures the release variant even for this debug unit test.
          # This fallback applies only to the test command, not to publication.
          AURA_ALLOW_DEBUG_SIGNING=true ./gradlew :app:testDebugUnitTest \
            --tests com.ciberdefensa.aura.VpnStartRequestGateTest \
            --tests com.ciberdefensa.aura.VpnLifecycleGateTest \
            --tests com.ciberdefensa.aura.VpnRecoveryGateTest \
            --tests com.ciberdefensa.aura.AuraSocks5CredentialsTest \
            --tests com.ciberdefensa.aura.Socks5AuthProtocolTest
      - name: Report Keystore migration validation status
        script: |
          echo '[AURA-VALIDATION][NOT RUN] La migración Keystore no se ejecuta en este workflow; requiere android-keystore-instrumented o un dispositivo Android autorizado.'
      - name: Build Android Release artifact
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          # The workflow defaults to test signing; an explicit production
          # setting must be honored consistently by build and verification.
          bash tool/compile_aura.sh
      - name: Verify Android Release artifact signer
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          if [[ "${AURA_REQUIRE_RELEASE_SIGNING:-false}" == "true" ]]; then
            # compile_aura.sh locates apksigner, verifies the APK and compares
            # its single signer to the configured keystore certificate.
            bash tool/compile_aura.sh --verify-artifact
          else
            printf '\033[1;41m%s\033[0m\n' '⚠️ ADVERTENCIA: Generando APK de pruebas (DEBUG). NO DISTRIBUIR.'
            echo "WARNING: Production signer verification skipped for the explicit DEBUG test build."
          fi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - pubspec.lock

  # Android emulators cannot run on Codemagic Apple-silicon macOS VMs.
  # This workflow is intentionally manual to avoid automatically consuming
  # paid Linux X2 build minutes on every push/PR.
  android-keystore-instrumented:
    name: Aura Android Keystore migration (Linux API 36 emulator)
    max_build_duration: 60
    instance_type: linux_x2
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Resolve Flutter dependencies and install declared NDK
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          flutter --version
          flutter pub get
          bash tool/install_android_ndk.sh
      - name: Boot isolated Android 16 emulator and run real Keystore migration tests
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          export ANDROID_SERIAL="emulator-5554"

          test -x "$ANDROID_SDK_ROOT/emulator/emulator" || {
            echo "ERROR: Android emulator binary is missing from $ANDROID_SDK_ROOT"
            exit 1
          }
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb" || {
            echo "ERROR: adb is missing from $ANDROID_SDK_ROOT"
            exit 1
          }
          test -r /dev/kvm && test -w /dev/kvm || {
            echo "ERROR: Linux runner has no accessible KVM device; refusing a slow or unaccelerated emulator substitute."
            exit 1
          }
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check

          if ! "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | grep -Fq "Name: emulator-36"; then
            echo "ERROR: Expected pre-provisioned API 36 AVD 'emulator-36' is unavailable on this runner."
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd
            exit 1
          fi

          "$ANDROID_SDK_ROOT/platform-tools/adb" start-server
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd emulator-36 -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -accel on > "$CM_BUILD_DIR/android-keystore-emulator.log" 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -d \
              > "$CM_BUILD_DIR/android-keystore-logcat.txt" 2>&1 || true
            "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          DEVICE_READY=false
          for attempt in $(seq 1 180); do
            if "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ANDROID_SERIAL" get-state 2>/dev/null | grep -qx "device"; then
              DEVICE_READY=true
              break
            fi
            sleep 2
          done
          if [[ "$DEVICE_READY" != "true" ]]; then
            echo "ERROR: Android emulator did not become an authorized adb device within 6 minutes."
            "$ANDROID_SDK_ROOT/platform-tools/adb" devices -l
            exit 1
          fi

          BOOT_COMPLETE=false
          for attempt in $(seq 1 180); do
            if [[ "$("$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOT_COMPLETE=true
              break
            fi
            sleep 2
          done
          if [[ "$BOOT_COMPLETE" != "true" ]]; then
            echo "ERROR: Android emulator was detected but did not finish booting."
            exit 1
          fi

          API_LEVEL="$("$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')"
          if [[ "$API_LEVEL" != "36" ]]; then
            echo "ERROR: Expected Android API 36, got API $API_LEVEL."
            exit 1
          fi
          echo "Confirmed Android API $API_LEVEL on $ANDROID_SERIAL"
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ANDROID_SERIAL" shell input keyevent 82 || true

          cd "$CM_BUILD_DIR/android"
          AURA_ALLOW_DEBUG_SIGNING=true ./gradlew --no-daemon --stacktrace \
            :app:connectedStorageMigrationAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.ciberdefensa.aura.SecureStorageMigrationTest
        test_report: build/app/outputs/androidTest-results/connected/**/*.xml
    artifacts:
      - android-keystore-emulator.log
      - android-keystore-logcat.txt
      - build/app/outputs/androidTest-results/connected/**/*.xml
