workflows:
  android-build:
    name: Aura Android Release Pipeline
    max_build_duration: 90
    # macOS M2 is available on Codemagic's individual free plan.
    # Linux X2 requires billing to be enabled.
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    environment:
      groups:
        - production_keys # This group must exist; values are managed by the owner in Codemagic.
      vars:
        # applicationId real definido en android/app/build.gradle: com.ciberdefensa.aura
        AURA_BUILD_FORMAT: "apk"
        AURA_REQUIRE_RELEASE_SIGNING: "false"
      flutter: 3.47.9
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        # PR builds must match the destination branch (main), not the
        # temporary feature/source branch. Push events still match main.
        - pattern: 'main'
          include: true
          source: false
        - pattern: 'principal'
          include: true
          source: false
    scripts:
      - name: Resolve Codemagic keystore file variable (Optional)
        script: |
          set -euo pipefail
          if [[ -n "${AURA_KEYSTORE_FILE:-}" && -z "${AURA_KEYSTORE_PATH:-}" ]]; then
            if [[ -f "$AURA_KEYSTORE_FILE" && -n "${CM_ENV:-}" ]]; then
              printf 'AURA_KEYSTORE_PATH=%s\n' "$AURA_KEYSTORE_FILE" >> "$CM_ENV"
            else
              echo '[AURA-PREFLIGHT][WARNING] AURA_KEYSTORE_FILE missing. Falling back to debug signing.'
            fi
          fi
      - name: Resolve Flutter dependencies and record toolchain
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          flutter --version
          flutter pub get
      - name: Install declared Android NDK
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          bash tool/install_android_ndk.sh
      - name: Check Dart formatting
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          dart format --set-exit-if-changed .
      - name: Analyze Flutter and Dart code
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          flutter analyze --no-pub
      - name: Run Aura security regression checks and Flutter tests
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          python3 tool/test_gradle_wrapper_policy.py
          python3 tool/test_install_android_ndk.py
          python3 tool/test_vpn_config_template.py
          python3 tool/test_aura_sni_firewall.py
          python3 tool/test_mapped_dns.py
          python3 tool/test_tun_packet_filter.py
          python3 tool/test_lwip_fragment_policy.py
          python3 tool/test_verify_packaged_model.py
          python3 tool/test_release_signing_policy.py
          python3 tool/test_release_signing_runtime.py
          python3 tool/test_verify_aab.py
          flutter test --reporter expanded
      - name: Test AI model and dataset safeguards
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          python3 --version
          VENV_DIR="$(mktemp -d "${TMPDIR:-/tmp}/aura-model-tests.XXXXXX")"
          trap 'rm -rf "$VENV_DIR"' EXIT
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install -r tool/requirements-train.txt
          "$VENV_DIR/bin/python" -m pytest -q -rs
      - name: Test VPN request correlation on Android JVM
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}/android"
          # Gradle configures the release variant even for this debug unit test.
          # This fallback applies only to the test command, not to publication.
          AURA_ALLOW_DEBUG_SIGNING=true ./gradlew :app:testDebugUnitTest \
            --tests com.ciberdefensa.aura.VpnStartRequestGateTest \
            --tests com.ciberdefensa.aura.VpnLifecycleGateTest \
            --tests com.ciberdefensa.aura.VpnRecoveryGateTest \
            --tests com.ciberdefensa.aura.AuraSocks5CredentialsTest \
            --tests com.ciberdefensa.aura.Socks5AuthProtocolTest
      - name: Report Keystore migration validation status
        script: |
          echo '[AURA-VALIDATION][NOT RUN] La migración Keystore no se ejecuta en este workflow; requiere el job Android Keystore de GitHub Actions o un dispositivo Android autorizado.'
      - name: Build Android Release artifact
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          # The workflow defaults to test signing; an explicit production
          # setting must be honored consistently by build and verification.
          bash tool/compile_aura.sh
      - name: Verify Android Release artifact signer
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          if [[ "${AURA_REQUIRE_RELEASE_SIGNING:-false}" == "true" ]]; then
            # compile_aura.sh locates apksigner, verifies the APK and compares
            # its single signer to the configured keystore certificate.
            bash tool/compile_aura.sh --verify-artifact
          else
            printf '\033[1;41m%s\033[0m\n' '⚠️ ADVERTENCIA: Generando APK de pruebas (DEBUG). NO DISTRIBUIR.'
            echo "WARNING: Production signer verification skipped for the explicit DEBUG test build."
          fi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - pubspec.lock
